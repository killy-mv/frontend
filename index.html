<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Flappy Bird - Plain HTML5 Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(ellipse at 50% 0%, #1f2937 0%, #111827 60%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      /* Stop double-tap-to-zoom and pull-to-refresh eating game taps */
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    .game-container {
      position: relative;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      overflow: hidden;
      line-height: 0;
    }

    canvas {
      display: block;
      background-color: #70c5ce;
      touch-action: none;
    }

    canvas:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 3px;
    }

    .instructions {
      margin-top: 16px;
      font-size: 14px;
      color: #9ca3af;
      text-align: center;
      line-height: 1.5;
      padding: 0 16px;
    }

    .instructions kbd {
      font: inherit;
      background: #1f2937;
      border: 1px solid #374151;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 1px 6px;
      color: #e5e7eb;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <canvas id="gameCanvas" width="360" height="512" tabindex="0"
            aria-label="Flappy Bird. Press space to flap and fly through the gaps between pipes.">
      This game needs a browser that supports the HTML5 canvas element.
    </canvas>
  </div>
  <p class="instructions">
    <kbd>Space</kbd>, <strong>Click</strong>, or <strong>Tap</strong> to flap
    &middot; <kbd>P</kbd> pause &middot; <kbd>M</kbd> mute
  </p>
  <p id="announcer" class="sr-only" aria-live="polite" role="status"></p>

  <script>
    "use strict";

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const announcer = document.getElementById("announcer");

    // ---------------------------------------------------------------------
    // Configuration
    // ---------------------------------------------------------------------
    // The game is written against a fixed 360x512 coordinate space. The canvas
    // backing store may be larger (high-DPI screens) or smaller (small phones),
    // but a transform maps everything back to these logical units.
    const VIEW_W = 360;
    const VIEW_H = 512;
    const GROUND_H = 80;
    const FLOOR_Y = VIEW_H - GROUND_H;

    // Simulation runs at a fixed 60 steps/sec regardless of display refresh rate.
    const STEP_MS = 1000 / 60;
    const MAX_FRAME_MS = 250; // clamp huge deltas (tab was backgrounded)

    const PIPE_W = 52;
    const PIPE_CAP_H = 16;
    const PIPE_CAP_OVERHANG = 3;
    const PIPE_MIN_MARGIN = 48; // min pipe length above/below the gap

    // Difficulty ramps from "easy" to "hard" over the first RAMP_SCORE points.
    const RAMP_SCORE = 25;
    const GAP_EASY = 112, GAP_HARD = 82;
    const SPEED_EASY = 2.0, SPEED_HARD = 3.2;
    const SPACING_EASY = 200, SPACING_HARD = 178; // horizontal px between pipes

    const RESTART_LOCK_STEPS = 30; // ~0.5s of ignored input after dying

    const reduceMotion = window.matchMedia
      ? window.matchMedia("(prefers-reduced-motion: reduce)").matches
      : false;

    // ---------------------------------------------------------------------
    // Safe localStorage (throws in private mode / sandboxed iframes)
    // ---------------------------------------------------------------------
    function storageGet(key, fallback) {
      try {
        const v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (err) {
        return fallback;
      }
    }

    function storageSet(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (err) {
        /* quota or access denied - scores just won't persist */
      }
    }

    // ---------------------------------------------------------------------
    // Game state
    // ---------------------------------------------------------------------
    // "READY" | "PLAYING" | "DYING" | "GAMEOVER" | "PAUSED"
    let gameState = "READY";
    let score = 0;
    let highScore = Number(storageGet("flappy_high_score", 0)) || 0;
    let muted = storageGet("flappy_muted", "0") === "1";
    let steps = 0;          // simulation steps elapsed
    let gameOverStep = 0;   // step at which GAMEOVER was entered
    let stateBeforePause = "READY";

    // Juice
    let shake = 0;
    let flash = 0;
    const particles = [];

    function difficulty() {
      const t = Math.min(score / RAMP_SCORE, 1);
      return {
        gap: GAP_EASY + (GAP_HARD - GAP_EASY) * t,
        speed: SPEED_EASY + (SPEED_HARD - SPEED_EASY) * t,
        spacing: SPACING_EASY + (SPACING_HARD - SPACING_EASY) * t
      };
    }

    // ---------------------------------------------------------------------
    // Audio - tiny WebAudio blips, created lazily on first user gesture
    // ---------------------------------------------------------------------
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        try {
          audioCtx = new AC();
        } catch (err) {
          return;
        }
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    }

    function tone(from, to, duration, type, volume) {
      if (muted || !audioCtx) return;
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(from, t0);
      osc.frequency.exponentialRampToValueAtTime(Math.max(to, 1), t0 + duration);
      gain.gain.setValueAtTime(volume, t0);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    }

    const sfx = {
      flap() { tone(480, 720, 0.09, "triangle", 0.07); },
      score() { tone(880, 1320, 0.09, "square", 0.05); },
      hit() { tone(240, 70, 0.22, "sawtooth", 0.09); },
      die() { tone(180, 45, 0.5, "sine", 0.08); }
    };

    // ---------------------------------------------------------------------
    // Drawing helpers
    // ---------------------------------------------------------------------
    function roundRect(x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function outlinedText(text, x, y) {
      ctx.strokeText(text, x, y);
      ctx.fillText(text, x, y);
    }

    // Circle vs axis-aligned rectangle. Used for collisions so the round bird
    // doesn't die on the invisible corners of its bounding box.
    function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
      const nearestX = Math.max(rx, Math.min(cx, rx + rw));
      const nearestY = Math.max(ry, Math.min(cy, ry + rh));
      const dx = cx - nearestX;
      const dy = cy - nearestY;
      return dx * dx + dy * dy < r * r;
    }

    // ---------------------------------------------------------------------
    // Parallax clouds
    // ---------------------------------------------------------------------
    const clouds = {
      list: [],

      init() {
        this.list = [];
        for (let i = 0; i < 5; i++) {
          this.list.push({
            x: (i * VIEW_W) / 5 + (i * 37) % 40,
            y: 40 + ((i * 61) % 130),
            scale: 0.6 + ((i * 17) % 10) / 20,
            speed: 0.12 + ((i * 13) % 8) / 40
          });
        }
      },

      update() {
        for (const c of this.list) {
          c.x -= c.speed;
          if (c.x < -70 * c.scale) {
            c.x = VIEW_W + 40;
            c.y = 40 + ((c.y * 7) % 130);
          }
        }
      },

      draw() {
        ctx.fillStyle = "rgba(255, 255, 255, 0.55)";
        for (const c of this.list) {
          const s = c.scale;
          ctx.beginPath();
          ctx.arc(c.x, c.y, 18 * s, 0, Math.PI * 2);
          ctx.arc(c.x + 20 * s, c.y + 5 * s, 14 * s, 0, Math.PI * 2);
          ctx.arc(c.x - 20 * s, c.y + 6 * s, 12 * s, 0, Math.PI * 2);
          ctx.arc(c.x + 4 * s, c.y - 10 * s, 13 * s, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    };

    // ---------------------------------------------------------------------
    // Bird
    // ---------------------------------------------------------------------
    const bird = {
      x: 50,
      y: 200,
      width: 28,
      height: 20,
      gravity: 0.25,
      jump: 4.6,
      velocity: 0,
      rotation: 0,
      wingPhase: 0,

      // Forgiving hitbox: a circle a bit smaller than the drawn body.
      get radius() { return (this.height / 2) * 0.86; },
      get cx() { return this.x + this.width / 2; },
      get cy() { return this.y + this.height / 2; },

      draw() {
        ctx.save();
        ctx.translate(this.cx, this.cy);
        ctx.rotate(this.rotation);

        // Wing - flaps faster while rising
        const wing = Math.sin(this.wingPhase) * 6;
        ctx.fillStyle = "#eab308";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(-4, 1 + wing * 0.35, 8, 5 + Math.abs(wing) * 0.2, wing * 0.06, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Body
        ctx.fillStyle = "#facc15";
        ctx.beginPath();
        ctx.ellipse(0, 0, this.width / 2, this.height / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Eye
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(6, -4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#000000";
        ctx.beginPath();
        ctx.arc(7, -4, 2, 0, Math.PI * 2);
        ctx.fill();

        // Beak
        ctx.fillStyle = "#f97316";
        ctx.beginPath();
        ctx.moveTo(8, 2);
        ctx.lineTo(16, 4);
        ctx.lineTo(8, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.restore();
      },

      flap() {
        this.velocity = -this.jump;
        this.wingPhase = 0;
        sfx.flap();
      },

      update() {
        if (gameState === "READY") {
          this.y = 200 + Math.sin(steps / 10) * 5;
          this.velocity = 0;
          this.rotation = 0;
          this.wingPhase += 0.18;
          return;
        }

        if (gameState !== "PLAYING" && gameState !== "DYING") return;

        this.velocity += this.gravity;
        this.y += this.velocity;
        this.wingPhase += this.velocity < 0 ? 0.55 : 0.18;

        if (gameState === "DYING") {
          // Nose-dive to the ground, then settle into the game over screen.
          this.rotation = Math.min(Math.PI / 2, this.rotation + 0.12);
          if (this.y + this.height >= FLOOR_Y) {
            this.y = FLOOR_Y - this.height;
            this.velocity = 0;
            gameState = "GAMEOVER";
            gameOverStep = steps;
            sfx.die();
            announce(`Game over. Score ${score}. Best ${highScore}.`);
          }
          return;
        }

        this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, this.velocity / 8));

        if (this.y + this.height >= FLOOR_Y) {
          this.y = FLOOR_Y - this.height;
          die(true);
        }

        if (this.y <= 0) {
          this.y = 0;
          this.velocity = 0;
        }
      },

      reset() {
        this.y = 200;
        this.velocity = 0;
        this.rotation = 0;
        this.wingPhase = 0;
      }
    };

    // ---------------------------------------------------------------------
    // Ground
    // ---------------------------------------------------------------------
    const fg = {
      height: GROUND_H,
      x: 0,

      draw() {
        const y = FLOOR_Y;

        // Grass band
        ctx.fillStyle = "#73bf2e";
        ctx.fillRect(0, y, VIEW_W, 12);

        // Scrolling notches so the movement is actually visible
        const tile = 24;
        ctx.fillStyle = "#5aa021";
        for (let x = (this.x % tile) - tile; x < VIEW_W; x += tile) {
          ctx.fillRect(x, y, tile / 2, 12);
        }

        ctx.fillStyle = "#558022";
        ctx.fillRect(0, y + 12, VIEW_W, 3);

        // Sand
        ctx.fillStyle = "#ded895";
        ctx.fillRect(0, y + 15, VIEW_W, GROUND_H - 15);

        ctx.strokeStyle = "#cfc784";
        ctx.lineWidth = 2;
        ctx.beginPath();
        const stripe = 32;
        for (let x = (this.x % stripe) - stripe; x < VIEW_W + stripe; x += stripe) {
          ctx.moveTo(x, y + GROUND_H);
          ctx.lineTo(x + 16, y + 18);
        }
        ctx.stroke();
      },

      update() {
        if (gameState !== "PLAYING") return;
        this.x -= difficulty().speed;
        // Keep the offset small so it never loses float precision.
        if (this.x <= -96) this.x += 96;
      }
    };

    // ---------------------------------------------------------------------
    // Pipes
    // ---------------------------------------------------------------------
    const pipes = {
      list: [],
      distanceSinceSpawn: Infinity, // spawn one immediately on first update

      draw() {
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000000";

        for (const p of this.list) {
          const bottomY = p.topY + p.gap;
          const bottomH = FLOOR_Y - bottomY;

          const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
          grad.addColorStop(0, "#5fa524");
          grad.addColorStop(0.35, "#8ed94a");
          grad.addColorStop(0.7, "#73bf2e");
          grad.addColorStop(1, "#4a8a1c");
          ctx.fillStyle = grad;

          // Top pipe + cap
          ctx.fillRect(p.x, 0, PIPE_W, p.topY);
          ctx.strokeRect(p.x, 0, PIPE_W, p.topY);
          ctx.fillRect(p.x - PIPE_CAP_OVERHANG, p.topY - PIPE_CAP_H, PIPE_W + PIPE_CAP_OVERHANG * 2, PIPE_CAP_H);
          ctx.strokeRect(p.x - PIPE_CAP_OVERHANG, p.topY - PIPE_CAP_H, PIPE_W + PIPE_CAP_OVERHANG * 2, PIPE_CAP_H);

          // Bottom pipe + cap
          ctx.fillRect(p.x, bottomY, PIPE_W, bottomH);
          ctx.strokeRect(p.x, bottomY, PIPE_W, bottomH);
          ctx.fillRect(p.x - PIPE_CAP_OVERHANG, bottomY, PIPE_W + PIPE_CAP_OVERHANG * 2, PIPE_CAP_H);
          ctx.strokeRect(p.x - PIPE_CAP_OVERHANG, bottomY, PIPE_W + PIPE_CAP_OVERHANG * 2, PIPE_CAP_H);
        }
      },

      spawn() {
        const { gap } = difficulty();
        const maxTop = FLOOR_Y - gap - PIPE_MIN_MARGIN;
        const minTop = PIPE_MIN_MARGIN;
        const topY = minTop + Math.random() * (maxTop - minTop);
        this.list.push({ x: VIEW_W, topY, gap, passed: false });
      },

      hits(p) {
        const bottomY = p.topY + p.gap;
        const cx = bird.cx, cy = bird.cy, r = bird.radius;
        return (
          // top body / bottom body
          circleHitsRect(cx, cy, r, p.x, 0, PIPE_W, p.topY) ||
          circleHitsRect(cx, cy, r, p.x, bottomY, PIPE_W, FLOOR_Y - bottomY) ||
          // caps stick out a little further, and the player can see that
          circleHitsRect(cx, cy, r, p.x - PIPE_CAP_OVERHANG, p.topY - PIPE_CAP_H, PIPE_W + PIPE_CAP_OVERHANG * 2, PIPE_CAP_H) ||
          circleHitsRect(cx, cy, r, p.x - PIPE_CAP_OVERHANG, bottomY, PIPE_W + PIPE_CAP_OVERHANG * 2, PIPE_CAP_H)
        );
      },

      update() {
        if (gameState !== "PLAYING") return;

        const { speed, spacing } = difficulty();

        this.distanceSinceSpawn += speed;
        if (this.distanceSinceSpawn >= spacing) {
          this.spawn();
          this.distanceSinceSpawn = 0;
        }

        // Iterate backwards so removal can't skip an element.
        for (let i = this.list.length - 1; i >= 0; i--) {
          const p = this.list[i];
          p.x -= speed;

          if (this.hits(p)) {
            die(false);
            return;
          }

          if (!p.passed && p.x + PIPE_W < bird.x) {
            p.passed = true;
            score++;
            sfx.score();
            if (score > highScore) {
              highScore = score;
              storageSet("flappy_high_score", String(highScore));
            }
            if (score % 10 === 0) announce(`Score ${score}`);
          }

          if (p.x + PIPE_W + PIPE_CAP_OVERHANG < 0) {
            this.list.splice(i, 1);
          }
        }
      },

      reset() {
        this.list = [];
        this.distanceSinceSpawn = Infinity;
      }
    };

    // ---------------------------------------------------------------------
    // Particles (feather burst on impact)
    // ---------------------------------------------------------------------
    function spawnFeathers() {
      if (reduceMotion) return;
      for (let i = 0; i < 14; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 3;
        particles.push({
          x: bird.cx,
          y: bird.cy,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          rot: Math.random() * Math.PI,
          vr: (Math.random() - 0.5) * 0.3,
          life: 40 + Math.random() * 25,
          size: 2 + Math.random() * 3
        });
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.vy += 0.12;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life--;
        if (p.life <= 0 || p.y > VIEW_H) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = Math.min(1, p.life / 25);
        ctx.fillStyle = p.size > 3.5 ? "#f97316" : "#facc15";
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.6);
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    }

    // ---------------------------------------------------------------------
    // UI
    // ---------------------------------------------------------------------
    function medalFor(value) {
      if (value >= 40) return { fill: "#e5e7eb", ring: "#9ca3af", label: "PLATINUM" };
      if (value >= 25) return { fill: "#fbbf24", ring: "#b45309", label: "GOLD" };
      if (value >= 10) return { fill: "#cbd5e1", ring: "#64748b", label: "SILVER" };
      if (value >= 5) return { fill: "#d97706", ring: "#78350f", label: "BRONZE" };
      return null;
    }

    function drawUI() {
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 3;

      if (gameState === "READY") {
        ctx.font = "bold 28px sans-serif";
        outlinedText("FLAPPY BIRD", VIEW_W / 2, 140);

        ctx.font = "16px sans-serif";
        ctx.lineWidth = 2;
        outlinedText("Click or Press Space to Play", VIEW_W / 2, 285);

        if (highScore > 0) {
          ctx.font = "14px sans-serif";
          outlinedText(`Best: ${highScore}`, VIEW_W / 2, 312);
        }
      } else if (gameState === "PLAYING" || gameState === "DYING") {
        ctx.font = "bold 36px sans-serif";
        outlinedText(String(score), VIEW_W / 2, 60);
      } else if (gameState === "PAUSED") {
        ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 30px sans-serif";
        outlinedText("PAUSED", VIEW_W / 2, VIEW_H / 2 - 8);
        ctx.font = "14px sans-serif";
        ctx.lineWidth = 2;
        outlinedText("Press P or tap to resume", VIEW_W / 2, VIEW_H / 2 + 22);
      } else if (gameState === "GAMEOVER") {
        const panelW = 220, panelH = 176;
        const px = (VIEW_W - panelW) / 2, py = 130;

        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);

        ctx.fillStyle = "#fef08a";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 3;
        roundRect(px, py, panelW, panelH, 10);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#dc2626";
        ctx.font = "bold 22px sans-serif";
        ctx.fillText("GAME OVER", VIEW_W / 2, py + 34);

        // Medal
        const medal = medalFor(score);
        if (medal) {
          const mx = px + 46, my = py + 92;
          ctx.beginPath();
          ctx.arc(mx, my, 24, 0, Math.PI * 2);
          ctx.fillStyle = medal.fill;
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = medal.ring;
          ctx.stroke();
          ctx.fillStyle = medal.ring;
          ctx.font = "bold 9px sans-serif";
          ctx.fillText(medal.label, mx, my + 3);
        }

        ctx.fillStyle = "#000000";
        ctx.textAlign = "right";
        ctx.font = "14px sans-serif";
        ctx.fillText("SCORE", px + panelW - 24, py + 78);
        ctx.font = "bold 24px sans-serif";
        ctx.fillText(String(score), px + panelW - 24, py + 102);
        ctx.font = "14px sans-serif";
        ctx.fillText("BEST", px + panelW - 24, py + 128);
        ctx.font = "bold 24px sans-serif";
        ctx.fillText(String(highScore), px + panelW - 24, py + 152);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 2;
        ctx.font = "14px sans-serif";
        const ready = steps - gameOverStep >= RESTART_LOCK_STEPS;
        outlinedText(
          ready ? "Click or Press Space to Restart" : "...",
          VIEW_W / 2,
          py + panelH + 28
        );
      }

      if (muted) {
        ctx.textAlign = "right";
        ctx.font = "12px sans-serif";
        ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
        ctx.strokeStyle = "rgba(0, 0, 0, 0.6)";
        ctx.lineWidth = 2;
        outlinedText("MUTED", VIEW_W - 10, 20);
      }
    }

    function announce(message) {
      announcer.textContent = message;
    }

    // ---------------------------------------------------------------------
    // State transitions
    // ---------------------------------------------------------------------
    function die(hitGround) {
      if (gameState !== "PLAYING") return; // guard against double-triggering
      sfx.hit();
      spawnFeathers();
      if (!reduceMotion) {
        shake = 10;
        flash = 1;
      }
      if (hitGround) {
        gameState = "GAMEOVER";
        gameOverStep = steps;
        bird.velocity = 0;
        sfx.die();
        announce(`Game over. Score ${score}. Best ${highScore}.`);
      } else {
        gameState = "DYING";
        bird.velocity = -2.5; // small pop before the nose-dive
      }
    }

    function startRun() {
      pipes.reset();
      bird.reset();
      particles.length = 0;
      score = 0;
      gameState = "PLAYING";
      bird.flap();
    }

    function togglePause() {
      if (gameState === "PLAYING") {
        stateBeforePause = gameState;
        gameState = "PAUSED";
        announce("Paused");
      } else if (gameState === "PAUSED") {
        gameState = stateBeforePause;
        announce("Resumed");
      }
    }

    function toggleMute() {
      muted = !muted;
      storageSet("flappy_muted", muted ? "1" : "0");
      announce(muted ? "Sound off" : "Sound on");
    }

    function handleAction() {
      initAudio();

      if (gameState === "READY") {
        startRun();
      } else if (gameState === "PLAYING") {
        bird.flap();
      } else if (gameState === "PAUSED") {
        togglePause();
      } else if (gameState === "GAMEOVER") {
        // Ignore the same burst of input that just killed the player.
        if (steps - gameOverStep >= RESTART_LOCK_STEPS) startRun();
      }
      // DYING intentionally ignores input.
    }

    // ---------------------------------------------------------------------
    // Input
    // ---------------------------------------------------------------------
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        if (e.repeat) return; // holding the key shouldn't auto-flap
        handleAction();
      } else if (e.code === "KeyP" || e.code === "Escape") {
        e.preventDefault();
        togglePause();
      } else if (e.code === "KeyM") {
        e.preventDefault();
        toggleMute();
      }
    });

    // pointerdown covers mouse, touch and pen in one listener, and fires
    // immediately instead of waiting for click's up-event.
    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      canvas.focus();
      handleAction();
    });

    // Auto-pause when the tab loses focus, so you don't come back to a corpse.
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && gameState === "PLAYING") togglePause();
      lastTime = performance.now();
    });

    window.addEventListener("blur", () => {
      if (gameState === "PLAYING") togglePause();
    });

    // ---------------------------------------------------------------------
    // Canvas sizing: high-DPI aware, and shrinks to fit small viewports
    // ---------------------------------------------------------------------
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const availableW = Math.min(window.innerWidth - 32, VIEW_W);
      const availableH = window.innerHeight - 110;
      const scale = Math.max(0.3, Math.min(availableW / VIEW_W, availableH / VIEW_H, 1));

      const cssW = Math.round(VIEW_W * scale);
      const cssH = Math.round(VIEW_H * scale);

      canvas.style.width = cssW + "px";
      canvas.style.height = cssH + "px";
      canvas.width = Math.round(cssW * dpr);
      canvas.height = Math.round(cssH * dpr);

      // Map the 360x512 logical space onto the backing store.
      ctx.setTransform(cssW / VIEW_W * dpr, 0, 0, cssH / VIEW_H * dpr, 0, 0);
    }

    window.addEventListener("resize", resize);

    // ---------------------------------------------------------------------
    // Simulation + render
    // ---------------------------------------------------------------------
    function update() {
      steps++;
      clouds.update();
      pipes.update();
      fg.update();
      bird.update();
      updateParticles();
      if (shake > 0) shake *= 0.88;
      if (flash > 0) flash -= 0.08;
    }

    function render() {
      ctx.save();

      if (shake > 0.3) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      // Sky
      const sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
      sky.addColorStop(0, "#4ec0ca");
      sky.addColorStop(1, "#8fd8e0");
      ctx.fillStyle = sky;
      ctx.fillRect(-20, -20, VIEW_W + 40, VIEW_H + 40);

      clouds.draw();
      pipes.draw();
      fg.draw();
      drawParticles();
      bird.draw();

      ctx.restore();

      if (flash > 0) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flash * 0.6})`;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      }

      drawUI();
    }

    // Fixed-timestep loop: physics always advance in 1/60s slices no matter
    // what the display refresh rate is, so the game plays identically on a
    // 60Hz laptop and a 144Hz monitor.
    let lastTime = performance.now();
    let accumulator = 0;

    function loop(now) {
      requestAnimationFrame(loop);

      let delta = now - lastTime;
      lastTime = now;
      if (delta > MAX_FRAME_MS) delta = MAX_FRAME_MS;

      accumulator += delta;
      while (accumulator >= STEP_MS) {
        update();
        accumulator -= STEP_MS;
      }

      render();
    }

    clouds.init();
    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
